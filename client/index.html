  <style id="critical-css">:root{--text:#374151;--text-h:#0f172a;--bg:#ffffff;--accent:#2563eb;--sans:Inter,system-ui,'Segoe UI',Roboto,sans-serif;--heading:'Outfit',system-ui,'Segoe UI',Roboto,sans-serif}

  </noscript>
  <script>
    // Re-enable heavy background once JS is ready (keeps initial paint fast)
    (function(){
      function enableBg(){
        try{
          var bg=document.querySelector('.universe-background');
          var canvas=document.getElementById('particleCanvas');
          if(bg){ bg.style.display=''; bg.style.visibility=''; }
          if(canvas){ canvas.style.display=''; canvas.style.visibility=''; }
        }catch(e){}
      }
      if(document.readyState==='complete' || document.readyState==='interactive'){
        setTimeout(enableBg, 300);
      } else {
        window.addEventListener('DOMContentLoaded', function(){ setTimeout(enableBg,300); });
      }
    })();
  </script>

<body class="bg-deep">
  <!-- Premium Animated Background System -->
  <div class="universe-background">
    <div class="bg-nebula-deep"></div>
    <div class="bg-stars-far"></div>
    <div class="bg-nebula-mid"></div>
    <div class="bg-stars-near"></div>
    <div class="bg-data-streams"></div>
    <div class="bg-geometric-grid"></div>
    <div class="bg-holographic-mist"></div>
    <div class="bg-mouse-glow" id="mouseGlow"></div>
  </div>
  <canvas id="particleCanvas"></canvas>

  <div id="root"></div>
  <script>
    (function(){
      function setLazy(img){ try{ if(img && !img.loading) img.loading='lazy'; }catch(e){}
      }
      document.addEventListener('DOMContentLoaded', function(){
        document.querySelectorAll('img').forEach(setLazy);
        new MutationObserver(function(mutations){
          mutations.forEach(function(m){
            m.addedNodes.forEach(function(node){
              if(node.nodeType===1){
                if(node.tagName==='IMG') setLazy(node);
                node.querySelectorAll && node.querySelectorAll('img').forEach(setLazy);
              }
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>

  <script src="/script.js" defer></script>
</body>
